version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: replenishment-db
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: replenishment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: replenishment-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
